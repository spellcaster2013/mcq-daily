name: MCQ Daily bot

on:
  schedule:
    - cron: "30 4 * * *"    # 10:00 IST  -> everything: 5 Telegram MCQs + Instagram + its answer
    - cron: "30 12 * * *"   # 18:00 IST  -> Instagram (+ its Telegram answer)
    - cron: "30 13 * * *"   # 19:00 IST  -> 5 Surgery MCQs on Telegram
  workflow_dispatch:
    inputs:
      preview_only:
        description: "Only draw the slides (download them from the run page), post nothing"
        type: boolean
        default: false
      subject:
        description: "Where to post: all, surgery (Telegram), medicine (Telegram), instagram, or answers (only the pending Telegram answers)"
        type: choice
        options: [all, surgery, medicine, instagram, answers]
        default: all

permissions:
  contents: write

concurrency: mcq-daily

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - name: Git identity
        run: |
          git config user.name "mcq-daily-bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SURGERY_CHAT_ID: ${{ secrets.SURGERY_CHAT_ID }}
          MEDICINE_CHAT_ID: ${{ secrets.MEDICINE_CHAT_ID }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.preview_only }}" = "true" ]; then ARGS="--preview"; fi
          SUBJ="${{ inputs.subject }}"
          case "${{ github.event.schedule }}" in
            "30 12 * * *") SUBJ=instagram ;;
            "30 13 * * *") SUBJ=surgery ;;
          esac
          if [ -n "$SUBJ" ] && [ "$SUBJ" != "all" ] && [ "$SUBJ" != "both" ]; then ARGS="$ARGS --only $SUBJ"; fi
          python bot.py $ARGS
      - name: Remember what was posted
        if: always()
        run: |
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Record posted MCQs" && git push)
      - name: Keep slides
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slides
          path: out/
          retention-days: 14
          if-no-files-found: ignore
