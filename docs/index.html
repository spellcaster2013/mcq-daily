<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A2A2E"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>MCQ Control</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:#0A2A2E;color:#fff;min-height:100vh;padding:24px 20px 40px}
main{max-width:460px;margin:0 auto}h1{font-size:22px;margin:8px 0 4px}p.sub{color:#9FB6B8;margin:0 0 24px;font-size:14px}
button{width:100%;border:0;border-radius:18px;padding:20px;font-size:19px;font-weight:700;color:#fff;margin-bottom:12px}
.both{background:#0E7C7B}.sur{background:#127a5a}.med{background:#4B3FBF}.ghost{background:#1c3f44;font-size:15px;padding:14px;font-weight:600}
button:disabled{opacity:.5}#msg{min-height:48px;margin:14px 0;font-size:15px;line-height:1.4}
.card{background:#10363b;border-radius:14px;padding:14px;margin:12px 0;font-size:14px;color:#cfe0e1}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #2b5359;background:#0A2A2E;color:#fff;font-size:15px;margin:8px 0}
a{color:#7fd4d2}small{color:#9FB6B8}
</style></head><body><main>
<h1>MCQ Control</h1><p class="sub">Surgery MCQ Daily and Medicine MCQ Daily</p>
<div id="setup" class="card" hidden>
 <b>One-time setup</b><br><small>Paste your GitHub token. It is saved only in this browser, never in the page.</small>
 <input id="tok" type="password" placeholder="github_pat_..." autocomplete="off">
 <button class="ghost" id="save">Save token</button>
</div>
<div id="app" hidden>
 <button class="both" data-s="both">Post now: both channels</button>
 <button class="sur" data-s="surgery">Post now: Surgery only</button>
 <button class="med" data-s="medicine">Post now: Medicine only</button>
 <div id="msg"></div>
 <div class="card" id="last">Last run: loading...</div>
 <button class="ghost" id="reset">Change or remove token</button>
</div>
<script>
const REPO="spellcaster2013/mcq-daily",WF="daily.yml",K="mcq_tok";
const $=id=>document.getElementById(id);let tok=null;
try{tok=localStorage.getItem(K)}catch(e){}
const api=(path,opt={})=>fetch("https://api.github.com/repos/"+REPO+path,{...opt,headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+tok,"X-GitHub-Api-Version":"2022-11-28"}});
function show(){ $("setup").hidden=!!tok; $("app").hidden=!tok; if(tok) last(); }
async function last(){
 try{const r=await api("/actions/runs?per_page=1");if(!r.ok)throw 0;const j=await r.json();const w=j.workflow_runs[0];
  $("last").textContent=w?("Last run: "+new Date(w.created_at).toLocaleString()+" - "+(w.conclusion||w.status)):"No runs yet";}
 catch(e){$("last").textContent="Could not read the last run (check the token)."}
}
$("save").onclick=()=>{const v=$("tok").value.trim();if(!v)return;tok=v;try{localStorage.setItem(K,v)}catch(e){}show()};
$("reset").onclick=()=>{try{localStorage.removeItem(K)}catch(e){}tok=null;$("tok").value="";show()};
document.querySelectorAll("button[data-s]").forEach(b=>b.onclick=async()=>{
 const s=b.dataset.s,label=s==="both"?"both channels":s;
 if(!confirm("Post the next MCQ to "+label+" now? This publishes to the public channel."))return;
 document.querySelectorAll("button[data-s]").forEach(x=>x.disabled=true);$("msg").textContent="Sending...";
 try{const r=await api("/actions/workflows/"+WF+"/dispatches",{method:"POST",body:JSON.stringify({ref:"main",inputs:{subject:s,preview_only:"false"}})});
  if(r.status===204){$("msg").textContent="Started. The post should appear in about a minute.";setTimeout(last,15000);setTimeout(last,60000)}
  else{$("msg").textContent="GitHub refused it ("+r.status+"). Check the token has Actions: Read and write on this repo."}}
 catch(e){$("msg").textContent="Network problem. Try again."}
 setTimeout(()=>document.querySelectorAll("button[data-s]").forEach(x=>x.disabled=false),4000);
});
show();
</script></main></body></html>
